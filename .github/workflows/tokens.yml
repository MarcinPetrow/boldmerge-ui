name: Tokens

on:
  pull_request:
    paths:
      - 'tokens/**'
      - 'scripts/**'
      - 'test/**'
      - 'dist/**'
      - 'examples/output/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tokens.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

