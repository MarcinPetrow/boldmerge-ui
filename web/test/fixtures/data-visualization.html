<!doctype html><html lang="en" data-bm-theme="light" data-bm-density="balanced" data-bm-accent="cyan"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><script type="module" src="./data-visualization.ts"></script></head><body><main><h1>Progress and KPI</h1><section class="grid"><article class="panel"><h2>Progress</h2><bm-progress id="progress" label="Storage used" value="37" value-label="37 GB of 100 GB"></bm-progress><bm-progress label="Migration" value="3" max="8" segments="8" value-label="3 of 8 steps"></bm-progress></article><article class="panel"><h2>Key metrics</h2><bm-kpi id="revenue" label="Monthly recurring revenue" value="$128,400" change="+8.2%" change-tone="favorable" comparison="versus last month"></bm-kpi><bm-kpi id="errors" label="Failed deployments" value="12" change="−25%" change-tone="favorable" comparison="fewer than last week"></bm-kpi></article><bm-theme theme="dark" density="compact" accent="violet"><article class="panel nested"><h2>Nested scope</h2><bm-kpi id="latency" label="P95 latency" value="248 ms" change="+18 ms" change-tone="unfavorable" comparison="versus target"></bm-kpi><bm-progress label="Quarter target" value="72" value-label="72% complete"></bm-progress></article></bm-theme></section></main></body></html>
