<!doctype html>
<html lang="en" data-bm-theme="light" data-bm-density="balanced" data-bm-accent="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoldMerge Checkbox demo</title>
    <script type="module" src="./checkbox.ts"></script>
  </head>
  <body><main><h1>Checkbox</h1><form class="stack">
    <bm-checkbox name="updates" checked>Receive deployment updates</bm-checkbox>
    <bm-checkbox name="selection" indeterminate>Select all visible rows</bm-checkbox>
    <bm-checkbox name="terms" required>Accept the terms</bm-checkbox>
    <bm-checkbox disabled>Unavailable option</bm-checkbox>
    <bm-button type="submit">Continue</bm-button>
  </form></main></body>
</html>
