<!doctype html>
<html lang="en" data-bm-theme="dark" data-bm-density="compact" data-bm-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoldMerge Card demo</title>
    <script type="module" src="./card.ts"></script>
  </head>
  <body><main><h1>Card</h1><bm-card label="Deployment summary">
    <h2 slot="header">Deployment</h2>
    <bm-button slot="actions" variant="ghost">Details</bm-button>
    <p>Production is healthy. All checks completed.</p>
    <span slot="footer" class="muted">Updated two minutes ago</span>
  </bm-card></main></body>
</html>
