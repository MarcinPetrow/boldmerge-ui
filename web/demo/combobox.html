<!doctype html><html lang="en" data-bm-theme="light" data-bm-density="balanced" data-bm-accent="cyan"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BoldMerge Combobox demo</title><script type="module" src="./combobox.ts"></script></head><body><main><h1>Combobox</h1><p>Search, use Arrow keys, and press Enter to select.</p><bm-combobox id="region" name="region" label="Deployment region" placeholder="Search regions" required><bm-option value="us">United States</bm-option><bm-option value="apac" disabled>Asia Pacific — unavailable</bm-option><bm-option value="eu">Europe</bm-option><bm-option value="sa">South America</bm-option><span slot="empty">No matching regions</span></bm-combobox><p id="result" aria-live="polite">No region selected.</p><bm-theme theme="dark" density="compact" accent="violet"><div class="nested"><h2>Nested Dark / Compact</h2><bm-combobox label="Team" value="platform"><bm-option value="design">Design</bm-option><bm-option value="platform">Platform</bm-option><bm-option value="security">Security</bm-option></bm-combobox></div></bm-theme></main></body></html>
